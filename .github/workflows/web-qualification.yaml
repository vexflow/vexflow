# Compare reviewed music in the same browser/OS as the candidate and retain the evidence on failure.
name: Web notation qualification
on: [push, pull_request]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    # Official Playwright 1.58.2 Noble image includes all three browser revisions and their native libraries.
    container: mcr.microsoft.com/playwright@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    timeout-minutes: 20
    env:
      VF_ENGRAVING_REFERENCE: 9a25f1dbc18031d2e2cf609ea0c4c93d5e554d6d
      VF_REQUIRE_REVIEWED_MATCH: '1'
      VF_WEB_REFERENCE: build/web-reference/build/cjs/vexflow-debug.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Allow Git to read the runner-mounted checkouts
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/build/web-reference"
      - run: npm ci
      - run: npx grunt webpack:debug
      - name: Check out the reviewed upstream reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vexflow/vexflow
          ref: 9a25f1dbc18031d2e2cf609ea0c4c93d5e554d6d
          path: build/web-reference
      - run: npm ci && npx grunt webpack:debug
        working-directory: build/web-reference
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm ci --ignore-scripts
        working-directory: tests/web
      - name: Run the three browser engines
        run: |
          # Firefox checks ownership of the home directory mounted by the Actions runner.
          chown "$(id -u):$(id -g)" "$HOME"
          node tests/web/qualify.mjs
      - name: Check the complete engraving gallery and historical release
        run: |
          git fetch --no-tags --depth=1 origin "$VF_ENGRAVING_REFERENCE"
          npm pack vexflow@5.2.0 --pack-destination "$RUNNER_TEMP" --silent
          tar -xzf "$RUNNER_TEMP/vexflow-5.2.0.tgz" -C "$RUNNER_TEMP" package/build/cjs/vexflow-debug-with-tests.js
          node tools/engraving-baseline.mjs "$RUNNER_TEMP/package/build/cjs/vexflow-debug-with-tests.js" build/web-reference/build/cjs/vexflow-debug-with-tests.js --playwright
      - name: Save browser reports, scores and standalone reader
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-notation-review
          path: |
            build/m7/
            build/engraving/run-*/
          if-no-files-found: warn
